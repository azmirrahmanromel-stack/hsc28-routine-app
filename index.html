<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>স্টাডি প্ল্যানার অ্যাপ</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f7f6;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 25px;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            font-weight: bold;
            color: #2e7d32;
        }

        .task-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-left: 5px solid #4CAF50;
            border-radius: 6px;
        }

        .task-card.completed {
            border-left-color: #757575;
            background: #eef2f0;
            opacity: 0.7;
        }

        .task-info {
            flex: 1;
        }

        .day {
            font-weight: bold;
            font-size: 17px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .topic {
            font-size: 14px;
            color: #666;
        }

        .task-card.completed .topic,
        .task-card.completed .day {
            text-decoration: line-through;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            min-width: 65px;
        }

        .btn.done {
            background: #757575;
        }

        #error {
            text-align: center;
            color: #d32f2f;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎯 ৩৯১ দিনের স্টাডি প্ল্যানার</h1>

    <div class="progress" id="progress">
        Loading...
    </div>

    <div id="taskList"></div>

    <div id="error"></div>

</div>

<script>

const STORAGE_KEY = "hsc28-study-progress";

async function loadRoutine() {

    const taskList = document.getElementById("taskList");
    const progress = document.getElementById("progress");
    const errorBox = document.getElementById("error");

    try {

        const response = await fetch("routine.json");

        if (!response.ok) {
            throw new Error("routine.json পাওয়া যায়নি");
        }

        const data = await response.json();

        let routine = [];

        /*
         * routine.json থেকে 391 দিনের data তৈরি হবে
         */
        if (Array.isArray(data)) {

            routine = data;

        } else if (data.totalDays) {

            for (let i = 1; i <= data.totalDays; i++) {

                routine.push({
                    id: i,
                    day: "Day " + i,
                    topic: "Day " + i + " Study Target"
                });

            }

        }

        if (routine.length === 0) {
            throw new Error("কোনো routine পাওয়া যায়নি");
        }

        const saved =
            JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

        taskList.innerHTML = "";

        routine.forEach(item => {

            const card = document.createElement("div");
            card.className = "task-card";

            const info = document.createElement("div");
            info.className = "task-info";

            const day = document.createElement("div");
            day.className = "day";
            day.textContent = item.day;

            const topic = document.createElement("div");
            topic.className = "topic";
            topic.textContent = item.topic;

            const button = document.createElement("button");
            button.className = "btn";

            const isCompleted = saved[item.id] === true;

            if (isCompleted) {
                card.classList.add("completed");
                button.classList.add("done");
                button.textContent = "Undo";
            } else {
                button.textContent = "Done";
            }

            button.onclick = function () {

                const completed =
                    card.classList.toggle("completed");

                button.classList.toggle("done");

                button.textContent =
                    completed ? "Undo" : "Done";

                saved[item.id] = completed;

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(saved)
                );

                updateProgress(routine, saved);
            };

            info.appendChild(day);
            info.appendChild(topic);

            card.appendChild(info);
            card.appendChild(button);

            taskList.appendChild(card);

        });

        updateProgress(routine, saved);

    } catch (error) {

        taskList.innerHTML = "";

        errorBox.textContent =
            "⚠️ সমস্যা হয়েছে: " + error.message;

        console.error(error);
    }
}


function updateProgress(routine, saved) {

    let completed = 0;

    routine.forEach(item => {

        if (saved[item.id] === true) {
            completed++;
        }

    });

    document.getElementById("progress").textContent =
        completed + " / " + routine.length +
        " দিন সম্পন্ন";
}


loadRoutine();


/* Service Worker */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("sw.js")
            .catch(error => {
                console.log(
                    "Service Worker Error:",
                    error
                );
            });

    });

}

</script>

</body>
</html>

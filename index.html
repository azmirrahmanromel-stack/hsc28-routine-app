<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSC 28 Academic Tracker</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071707;
  color:#fff;
}

header{
  padding:20px 15px;
  text-align:center;
  background:#0b260b;
  border-bottom:1px solid #1cff5b;
}

h1{
  margin:0;
  color:#39ff72;
  font-size:24px;
}

.subtitle{
  margin-top:7px;
  color:#66ffff;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.progress-box{
  background:#0d210d;
  border:1px solid #28ff68;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.progress-bar{
  height:12px;
  background:#183018;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress{
  height:100%;
  width:0%;
  background:#39ff72;
  transition:.3s;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

input,select{
  flex:1;
  min-width:150px;
  padding:12px;
  border-radius:8px;
  border:1px solid #39ff72;
  background:#0b1c0b;
  color:white;
}

.day{
  background:#0d210d;
  border:1px solid #245b2c;
  border-radius:14px;
  margin-bottom:14px;
  padding:16px;
}

.day.done{
  border-color:#39ff72;
}

.day-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.day-title h2{
  margin:0;
  color:#39ff72;
  font-size:20px;
}

.phase{
  color:#66ffff;
  font-size:13px;
}

.task{
  margin-top:12px;
  padding:12px;
  background:#071507;
  border-left:3px solid #39ff72;
  border-radius:8px;
}

.subject{
  color:#ffe45c;
  font-weight:bold;
  font-size:16px;
}

.topic{
  margin-top:5px;
  color:#fff;
}

.type{
  margin-top:5px;
  color:#aaa;
  font-size:13px;
}

button{
  margin-top:14px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#39ff72;
  color:#031003;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.pdf{
  background:#66ffff;
  margin-left:5px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <h1>HSC 28 ACADEMIC TRACKER</h1>
  <div class="subtitle">Academic to Admission • 391 Days</div>
</header>

<div class="container">

  <div class="progress-box">
    <b id="progressText">0 / 391 Days Completed</b>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="Search Day / Subject / Topic..."
    >

    <select id="phase">
      <option value="all">All Phases</option>
      <option value="1">Phase 1 — Academic</option>
      <option value="2">Phase 2 — Pre Admission</option>
      <option value="3">Phase 3 — Full Admission</option>
    </select>

  </div>

  <div id="routine">
    <div class="empty">Loading routine...</div>
  </div>

</div>

<script>

let routine = [];
let completed = JSON.parse(
  localStorage.getItem("hsc28_completed") || "{}"
);

async function loadRoutine(){

  try{

    const response = await fetch("routine.json");

    if(!response.ok){
      throw new Error("routine.json not found");
    }

    routine = await response.json();

    render();

  }catch(error){

    document.getElementById("routine").innerHTML = `
      <div class="empty">
        <h3>Routine load হয়নি</h3>
        <p>Check করো যে <b>routine.json</b> একই folder/repository-তে আছে।</p>
      </div>
    `;

    console.error(error);
  }
}


function render(){

  const search =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  const phase =
    document.getElementById("phase").value;

  const container =
    document.getElementById("routine");

  container.innerHTML = "";

  let shown = 0;

  routine.forEach(day => {

    const text =
      JSON.stringify(day).toLowerCase();

    if(search && !text.includes(search)){
      return;
    }

    if(
      phase !== "all" &&
      String(day.phase) !== phase
    ){
      return;
    }

    shown++;

    const isDone =
      completed[day.id] === true;

    const card =
      document.createElement("div");

    card.className =
      "day" + (isDone ? " done" : "");

    let tasksHTML = "";

    if(Array.isArray(day.tasks)){

      day.tasks.forEach(task => {

        tasksHTML += `
          <div class="task">

            <div class="subject">
              ${task.subject || ""}
            </div>

            <div class="topic">
              ${task.topic || ""}
            </div>

            ${
              task.type
              ? `<div class="type">${task.type}</div>`
              : ""
            }

          </div>
        `;

      });

    }else{

      tasksHTML = `
        <div class="task">
          ${day.topic || "Study Target"}
        </div>
      `;

    }

    card.innerHTML = `

      <div class="day-title">

        <h2>
          Day ${day.id}
          ${isDone ? " ✓" : ""}
        </h2>

        <div class="phase">
          ${day.phaseName || ""}
        </div>

      </div>

      ${tasksHTML}

      <button onclick="toggleDone(${day.id})">
        ${isDone ? "↩ Undo" : "✓ Done"}
      </button>

      <button
        class="pdf"
        onclick="openPDF(${day.id})">
        📖 PDF
      </button>

    `;

    container.appendChild(card);

  });

  if(shown === 0){

    container.innerHTML = `
      <div class="empty">
        No routine found.
      </div>
    `;

  }

  updateProgress();
}


function toggleDone(id){

  completed[id] =
    !completed[id];

  localStorage.setItem(
    "hsc28_completed",
    JSON.stringify(completed)
  );

  render();
}


function updateProgress(){

  const total =
    routine.length || 391;

  const done =
    Object.values(completed)
      .filter(Boolean)
      .length;

  const percent =
    Math.min(
      100,
      Math.round((done / total) * 100)
    );

  document.getElementById(
    "progressText"
  ).textContent =
    `${done} / ${total} Days Completed`;

  document.getElementById(
    "progress"
  ).style.width =
    percent + "%";
}


function openPDF(day){

  /*
    PDF page mapping:
    Day 1 starts around PDF page 4.
    This opens the original routine PDF.
  */

  window.open(
    "routine.pdf",
    "_blank"
  );
}


document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );

document
  .getElementById("phase")
  .addEventListener(
    "change",
    render
  );

loadRoutine();

</script>

</body>
</html>

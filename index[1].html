<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্টাডি প্ল্যানার অ্যাপ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 24px; }
        .task-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; margin-bottom: 10px; background: #f9f9f9; border-left: 5px solid #4CAF50; border-radius: 6px; }
        .task-card.completed { border-left-color: #9e9e9e; background: #eef2f0; text-decoration: line-through; opacity: 0.7; }
        .btn { background: #4CAF50; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn.done { background: #757575; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 ৭০ দিনের স্টাডি প্ল্যানার</h1>
        <div id="taskList"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
